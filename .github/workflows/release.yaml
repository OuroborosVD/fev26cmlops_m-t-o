name: Release

# ---------------------------------------------------
# Déclenchement uniquement sur la branche master
# ---------------------------------------------------

on:
  push:
    branches:
      - master

jobs:

  release:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Récupération du repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Installation de Python
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------
      # 3. Installation des dépendances
      # ---------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------
      # 4. Vérification qualité du code
      # ---------------------------------------------------
      - name: Run flake8
        run: |
          flake8 src tests

      # ---------------------------------------------------
      # 5. Exécution des tests unitaires
      # ---------------------------------------------------
      - name: Run unit tests
        run: |
          pytest tests/

      # ---------------------------------------------------
      # 6. Build de l'image Docker
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest .

      # ---------------------------------------------------
      # 7. Connexion à DockerHub
      # ---------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------
      # 8. Push de l'image sur DockerHub
      # ---------------------------------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest
```
