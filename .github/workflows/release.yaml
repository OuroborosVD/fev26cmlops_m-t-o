name: Release

# On déclenche uniquement sur master (demandé à la pahse 3)
on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      
      # Récupération du repo      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Installation Python      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      # Installation des dépendances      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      # Action Linter 
      - name: Run flake8
        run: |
          flake8 src tests
      
      # Action tests unitaires      
      - name: Run unit tests
        run: |
          pytest tests/
    
      # Action Build & Deployement images DockerHub      
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest .
      
      # Connexion DockerHub      
      - name: Connexion DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Action Push sur DockerHub      
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest
